[workspace]
members = ["rust/avd-data", "python-avd/rust"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aristanetworks/avd"
publish = false

[workspace.dependencies]
avd-data = { path = "rust/avd-data" }
avdschema = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "b94061aa48e473f719162535d127fc059bc826ce", default-features = false }
pyo3 = "0.29.0"
derive_more = "2.0.1"
serde = "1.0.229"
serde_json = "1.0.150"
validation = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "b94061aa48e473f719162535d127fc059bc826ce", default-features = false }
data-views = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "b94061aa48e473f719162535d127fc059bc826ce" }
data-views-py = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "b94061aa48e473f719162535d127fc059bc826ce" }
