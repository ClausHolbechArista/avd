[workspace]
members = ["python-avd/rust"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aristanetworks/avd"
publish = false

[workspace.dependencies]
avdschema = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "609e7a638d53d63d9380df915ee603577b4b1d84", default-features = false }
pyo3 = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.150"
validation = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "609e7a638d53d63d9380df915ee603577b4b1d84", default-features = false }
validated-data = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "609e7a638d53d63d9380df915ee603577b4b1d84" }
validated-data-py = { git = "https://github.com/ClausHolbechArista/pyavd-utils", rev = "609e7a638d53d63d9380df915ee603577b4b1d84" }
