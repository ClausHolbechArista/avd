[package]
name = "pyavd-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
avdschema = { workspace = true, features = ["mmap"] }
pyo3 = { workspace = true, features = ["abi3-py310"] }
serde.workspace = true
serde_json.workspace = true
validation = { workspace = true, features = ["archive", "regex-perf"] }
data-views.workspace = true
data-views-py.workspace = true
